name: Mobile

on:
  push:
  pull_request:

jobs:
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Smoke + deep-link unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (www @ 390×844)
        run: npm run test:mobile:playwright
